<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MineRisk Satellite Heatmap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:'Segoe UI', Arial, sans-serif; }
  #map { width:100%; height:100vh; background:#111; }

  .legend-box {
    background: rgba(20,20,20,0.85);
    color:#fff; padding:12px 16px; border-radius:6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    font-size:13px; line-height:1.6; min-width:190px;
  }
  .legend-box h4 { margin:0 0 8px 0; font-size:13px; letter-spacing:0.5px; }
  .legend-row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .swatch { width:16px; height:16px; border-radius:3px; display:inline-block; border:1px solid rgba(255,255,255,0.3);}

  .title-box {
    background: rgba(20,20,20,0.85); color:#fff; padding:10px 18px;
    border-radius:6px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .title-box h2 { margin:0; font-size:16px; }
  .title-box .sub { font-size:11px; color:#ccc; margin-top:2px; }

  .zone-label {
    background: rgba(0,0,0,0.65); color:#fff; font-weight:700; font-size:11px;
    padding:2px 6px; border-radius:3px; white-space:nowrap; border:none; box-shadow:none;
  }
  .zone-label::before { display:none; }

  .leaflet-popup-content { font-size:12.5px; line-height:1.5; min-width:220px; }
  .leaflet-popup-content h3 { margin:0 0 4px 0; font-size:14px; }
  .risk-pill {
    display:inline-block; padding:2px 8px; border-radius:10px; color:#fff;
    font-weight:700; font-size:11px; margin-bottom:6px;
  }
  .alert-line { color:#c0392b; font-weight:600; }
  .reason-line { color:#555; }
</style>
</head>
<body>
<div id="map"></div>

<script>
const zones = [{"zone_id": "A-01", "name": "Panel A-01", "lat": 23.754, "lon": 85.862, "risk_score": 10.5, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.38, "co_ppm": 13.24, "oxygen_pct": 20.85, "worker_count": 9, "reasons": ["Methane risk elevated: 0.38%", "CO risk elevated: 13.2 ppm", "Oxygen level requires attention: 20.85%", "1 equipment failure(s) in 30 days"], "alerts": [], "components": {"Gas": 5.8, "Equipment": 30, "Safety observations": 0, "Incident history": 10, "Inspection overdue": 0}}, {"zone_id": "A-02", "name": "Panel A-02", "lat": 23.752, "lon": 85.868, "risk_score": 23.9, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.337, "co_ppm": 8.82, "oxygen_pct": 20.67, "worker_count": 14, "reasons": ["Oxygen level requires attention: 20.67%", "1 equipment failure(s) in 30 days", "1 safety observation(s) in 48 hours", "1 incident(s) in the past 90 days", "Inspection overdue by 1 day(s)"], "alerts": [], "components": {"Gas": 4.1, "Equipment": 30, "Safety observations": 35, "Incident history": 50, "Inspection overdue": 30}}, {"zone_id": "B-11", "name": "Panel B-11", "lat": 23.75, "lon": 85.871, "risk_score": 24.6, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.332, "co_ppm": 11.1, "oxygen_pct": 20.63, "worker_count": 20, "reasons": ["CO risk elevated: 11.1 ppm", "Oxygen level requires attention: 20.63%", "1 equipment failure(s) in 30 days", "1 safety observation(s) in 48 hours", "1 incident(s) in the past 90 days", "Inspection overdue by 1 day(s)"], "alerts": [], "components": {"Gas": 5.9, "Equipment": 30, "Safety observations": 35, "Incident history": 50, "Inspection overdue": 30}}, {"zone_id": "B-12", "name": "Panel B-12", "lat": 23.748, "lon": 85.873, "risk_score": 56.8, "risk_level": "Moderate", "color": "#fdae61", "methane_pct": 0.602, "co_ppm": 19.88, "oxygen_pct": 20.35, "worker_count": 34, "reasons": ["Methane risk elevated: 0.60%", "CO risk elevated: 19.9 ppm", "Oxygen level requires attention: 20.35%", "2 equipment failure(s) in 30 days", "2 safety observation(s) in 48 hours", "1 incident(s) in the past 90 days", "Inspection overdue by 3 day(s)"], "alerts": [], "components": {"Gas": 33.7, "Equipment": 60, "Safety observations": 70, "Incident history": 70, "Inspection overdue": 90}}, {"zone_id": "H-01", "name": "Haul Road H-01", "lat": 23.753, "lon": 85.866, "risk_score": 9.8, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.292, "co_ppm": 5.81, "oxygen_pct": 20.61, "worker_count": 7, "reasons": ["Oxygen level requires attention: 20.61%", "1 safety observation(s) in 48 hours"], "alerts": [], "components": {"Gas": 5.2, "Equipment": 0, "Safety observations": 35, "Incident history": 10, "Inspection overdue": 0}}, {"zone_id": "H-02", "name": "Haul Road H-02", "lat": 23.756, "lon": 85.864, "risk_score": 20.9, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.223, "co_ppm": 9.2, "oxygen_pct": 20.68, "worker_count": 23, "reasons": ["Oxygen level requires attention: 20.68%", "1 equipment failure(s) in 30 days", "1 safety observation(s) in 48 hours", "1 incident(s) in the past 90 days"], "alerts": [], "components": {"Gas": 3.9, "Equipment": 30, "Safety observations": 35, "Incident history": 50, "Inspection overdue": 0}}, {"zone_id": "W-01", "name": "Workshop W-01", "lat": 23.757, "lon": 85.872, "risk_score": 21.1, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.283, "co_ppm": 9.14, "oxygen_pct": 20.8, "worker_count": 10, "reasons": ["Oxygen level requires attention: 20.80%", "1 equipment failure(s) in 30 days", "1 safety observation(s) in 48 hours", "1 incident(s) in the past 90 days", "Inspection overdue by 1 day(s)"], "alerts": [], "components": {"Gas": 1.8, "Equipment": 30, "Safety observations": 35, "Incident history": 30, "Inspection overdue": 30}}, {"zone_id": "V-01", "name": "Ventilation V-01", "lat": 23.755, "lon": 85.874, "risk_score": 11.5, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.319, "co_ppm": 7.31, "oxygen_pct": 20.92, "worker_count": 27, "reasons": ["1 equipment failure(s) in 30 days", "Inspection overdue by 1 day(s)"], "alerts": [], "components": {"Gas": 0.0, "Equipment": 30, "Safety observations": 0, "Incident history": 10, "Inspection overdue": 30}}, {"zone_id": "C-01", "name": "Crusher C-01", "lat": 23.758, "lon": 85.87, "risk_score": 4.9, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.307, "co_ppm": 7.21, "oxygen_pct": 20.75, "worker_count": 23, "reasons": ["Oxygen level requires attention: 20.75%", "Inspection overdue by 1 day(s)"], "alerts": [], "components": {"Gas": 2.7, "Equipment": 0, "Safety observations": 0, "Incident history": 10, "Inspection overdue": 30}}, {"zone_id": "S-01", "name": "Storage S-01", "lat": 23.759, "lon": 85.867, "risk_score": 7.9, "risk_level": "Low", "color": "#1a9850", "methane_pct": 0.309, "co_ppm": 7.85, "oxygen_pct": 20.75, "worker_count": 11, "reasons": ["Oxygen level requires attention: 20.75%", "1 safety observation(s) in 48 hours"], "alerts": [], "components": {"Gas": 2.7, "Equipment": 0, "Safety observations": 35, "Incident history": 0, "Inspection overdue": 0}}];

const map = L.map('map', { zoomControl: true }).setView([23.754200000000004, 85.8687], 15);

// Real ESRI World Imagery satellite basemap (loads directly in your browser)
const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
).addTo(map);

// Optional road/label reference overlay for context
const labels = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Esri', maxZoom: 19, opacity: 0.9 }
).addTo(map);

// Fallback plain street layer, selectable via layer control
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
});

L.control.layers({ "Satellite": satellite, "Streets": streets }, {}, { position: 'topright' }).addTo(map);

// --- Risk heat-blob overlay ---
const heatPoints = zones.map(z => [z.lat, z.lon, Math.max(z.risk_score / 100, 0.08)]);
const heat = L.heatLayer(heatPoints, {
  radius: 65,
  blur: 55,
  maxZoom: 17,
  max: 1.0,
  gradient: { 0.0: '#1a9850', 0.3: '#66bd63', 0.5: '#fee08b', 0.7: '#fdae61', 0.85: '#f46d43', 1.0: '#7f0000' }
}).addTo(map);

// --- Zone markers, labels, popups ---
zones.forEach(z => {
  const marker = L.circleMarker([z.lat, z.lon], {
    radius: 6, color: '#fff', weight: 1.5, fillColor: z.color, fillOpacity: 0.95
  }).addTo(map);

  marker.bindTooltip(z.name.toUpperCase(), {
    permanent: true, direction: 'top', offset: [0, -8], className: 'zone-label'
  });

  let reasonsHtml = z.reasons.map(r => `<div class="reason-line">&bull; ${r}</div>`).join('');
  let alertsHtml = z.alerts.length
    ? z.alerts.map(a => `<div class="alert-line">${a}</div>`).join('')
    : '<div style="color:#2e7d32;">No emergency-rule condition detected.</div>';

  marker.bindPopup(`
    <h3>${z.name}</h3>
    <span class="risk-pill" style="background:${z.color};">${z.risk_level} &middot; ${z.risk_score}/100</span>
    <div>Methane: ${z.methane_pct}% &nbsp;|&nbsp; CO: ${z.co_ppm} ppm &nbsp;|&nbsp; O2: ${z.oxygen_pct}%</div>
    <div>Workers on site: ${z.worker_count}</div>
    <hr style="margin:6px 0;">
    <b>Why:</b>${reasonsHtml}
    <hr style="margin:6px 0;">
    <b>Safety status:</b>${alertsHtml}
  `);
});

// --- Legend ---
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend-box');
  div.innerHTML = `
    <h4>RISK ASSESSMENT HEATMAP</h4>
    <div class="legend-row"><span class="swatch" style="background:#d73027;"></span> RED: High / Critical Risk</div>
    <div class="legend-row"><span class="swatch" style="background:#fdae61;"></span> ORANGE: Moderate Risk</div>
    <div class="legend-row"><span class="swatch" style="background:#1a9850;"></span> GREEN: Low Risk</div>
  `;
  return div;
};
legend.addTo(map);

// --- Title box ---
const title = L.control({ position: 'topleft' });
title.onAdd = function () {
  const div = L.DomUtil.create('div', 'title-box');
  div.innerHTML = `<h2>&#9935; MineRisk Heatmap</h2><div class="sub">Live satellite view &middot; explainable zone risk</div>`;
  return div;
};
title.addTo(map);

// --- Scale bar ---
L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);
</script>
</body>
</html>
